<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض زيت الزيتون للبيع - المنصة الرقمية</title>
    <style>
        :root {
            --primary: #2e5a27;
            --whatsapp: #25d366;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; padding: 40px 20px; direction: rtl; text-align: right; }
        .container { max-width: 600px; margin: 0 auto; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 35px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .header { text-align: center; margin-bottom: 30px; }
        .header img { max-width: 100px; height: auto; margin-bottom: 15px; }
        .header h1 { font-size: 20px; color: var(--primary); font-weight: 700; }
        
        form { display: flex; flex-direction: column; gap: 18px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; font-weight: 600; color: var(--text-main); }
        input[type="text"], input[type="tel"], input[type="number"], textarea, input[type="file"] { 
            padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; background: #fafafa; width: 100%; transition: border-color 0.2s; 
        }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); background: #fff; }
        
        .file-upload-box {
            border: 2px dashed var(--border-color);
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            background: #fafafa;
            cursor: pointer;
            transition: 0.2s;
        }
        .file-upload-box:hover { border-color: var(--primary); background: #f0fdf4; }
        .file-upload-box input { display: none; }
        .file-label { font-size: 13px; color: var(--text-muted); cursor: pointer; display: block; }

        button { background-color: var(--primary); color: white; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #23461e; }
        
        .whatsapp-notice { background: #f0fdf4; border: 1px solid #dcfce7; padding: 20px; border-radius: 10px; text-align: center; margin-top: 25px; }
        .whatsapp-notice p { font-size: 13px; color: #166534; margin-bottom: 12px; }
        .btn-wa { display: inline-block; background-color: var(--whatsapp); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; }
        
        .back-link { display: block; text-align: center; margin-top: 25px; color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="logoSAM.png" alt="Logo SAM">
            <h1>استمارة عرض زيت الزيتون للبيع</h1>
        </div>
        
        <form id="offerForm" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label>اسم العارض / المعصرة</label>
                <input type="text" id="name" required placeholder="مثال: معصرة البدر">
            </div>
            
            <div class="form-group">
                <label>رقم الهاتف (واتساب للتواصل)</label>
                <input type="tel" id="phone" required placeholder="06XXXXXXXX">
            </div>
            
            <div class="form-group">
                <label>الكمية المتوفرة (لتر)</label>
                <input type="number" id="quantity" required placeholder="مثال: 500">
            </div>
            
            <div class="form-group">
                <label>المنطقة / المدينة</label>
                <input type="text" id="region" required placeholder="مثال: العطاوية">
            </div>

            <!-- خانة الوصف التفصيلي -->
            <div class="form-group">
                <label>وصف العرض (الجودة، نوع العصر، الثمن...)</label>
                <textarea id="description" rows="3" placeholder="اكتب تفاصيل إضافية حول جودة الزيت أو السعر..."></textarea>
            </div>

            <!-- خانة تحميل الملفات (صور أو فيديوهات) -->
            <div class="form-group">
                <label>تحميل وسائط المنتج (صور أو فيديوهات توضيحية)</label>
                <div class="file-upload-box" onclick="document.getElementById('mediaFile').click()">
                    <span class="file-label" id="fileText">📁 انقر هنا لاختيار صورة أو فيديو للمنتج</span>
                    <input type="file" id="mediaFile" accept="image/*,video/*" onchange="updateFileName()">
                </div>
            </div>

            <button type="submit">تأكيد النشر والانتقال للمجموعة</button>
        </form>

        <div class="whatsapp-notice">
            <p>بعد التأكيد، سيتم توجيهك مباشرة لمجموعة الواتساب لنشر عرضك مرفقاً بالتفاصيل:</p>
            <a href="https://chat.whatsapp.com/L5dneKof0Qc8Wk3jZCgZJ6?s=cl&p=a&mlu=4&ilr=4" target="_blank" class="btn-wa" id="waLink">الانضمام لمجموعة واتساب الزيت</a>
        </div>

        <a href="index.html" class="back-link">← العودة إلى الرئيسية</a>
    </div>

    <script>
        function updateFileName() {
            const input = document.getElementById('mediaFile');
            const fileText = document.getElementById('fileText');
            if (input.files && input.files[0]) {
                fileText.textContent = "📎 تم إرفاق الملف: " + input.files[0].name;
            }
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const region = document.getElementById('region').value;
            const desc = document.getElementById('description').value;
            
            // تنبيه نجاح العملية مع التوجيه التلقائي لمجموعة الواتساب
            alert('تم تأكيد طلبك بنجاح! سيتم توجيهك الآن لمجموعة الواتساب لنشر تفاصيل العرض.');
            window.open("https://chat.whatsapp.com/L5dneKof0Qc8Wk3jZCgZJ6?s=cl&p=a&mlu=4&ilr=4", "_blank");
        }
    </script>
</body>
</html>
